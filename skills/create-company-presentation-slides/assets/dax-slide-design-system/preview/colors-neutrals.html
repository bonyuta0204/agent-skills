<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>Neutrals</title>
<link rel="stylesheet" href="_card.css">
</head><body><div class="card">
  <div class="wrap">
    <div class="swatch" style="background:#000000;">
      <div class="name">fg-0</div><div class="hex">#000000</div>
    </div>
    <div class="swatch" style="background:#434343;">
      <div class="name">fg-1 body</div><div class="hex">#434343</div>
    </div>
    <div class="swatch" style="background:#595959;">
      <div class="name">fg-2</div><div class="hex">#595959</div>
    </div>
    <div class="swatch" style="background:#666666;">
      <div class="name">fg-3 label</div><div class="hex">#666666</div>
    </div>
    <div class="swatch light" style="background:#B7B7B7;">
      <div class="name">fg-mute</div><div class="hex">#B7B7B7</div>
    </div>
    <div class="swatch light" style="background:#CCCCCC;">
      <div class="name">rule / disable</div><div class="hex">#CCCCCC</div>
    </div>
    <div class="swatch light" style="background:#F2F2F2; border-color:#ddd;">
      <div class="name">bg softer</div><div class="hex">#F2F2F2</div>
    </div>
    <div class="swatch light" style="background:#F3F3F3; border-color:#ddd;">
      <div class="name">bg soft</div><div class="hex">#F3F3F3</div>
    </div>
    <div class="swatch light" style="background:#FFFFFF; border-color:#ccc;">
      <div class="name">bg page</div><div class="hex">#FFFFFF</div>
    </div>
  </div>
</div></body></html>

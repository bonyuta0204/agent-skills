<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>Spacing scale</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row-sp { display:flex; align-items:center; gap:12px; }
  .bar { background:#00AFF4; height:14px; border-radius:2px; }
  .cap { font-family: var(--ff-mono); font-size:11px; color:var(--fg-3); min-width:96px; }
</style>
</head><body><div class="card">
  <div class="row-sp"><div class="cap">sp-1 · 4px</div>  <div class="bar" style="width:4px"></div></div>
  <div class="row-sp"><div class="cap">sp-2 · 8px</div>  <div class="bar" style="width:8px"></div></div>
  <div class="row-sp"><div class="cap">sp-3 · 12px</div> <div class="bar" style="width:12px"></div></div>
  <div class="row-sp"><div class="cap">sp-4 · 16px</div> <div class="bar" style="width:16px"></div></div>
  <div class="row-sp"><div class="cap">sp-5 · 24px</div> <div class="bar" style="width:24px"></div></div>
  <div class="row-sp"><div class="cap">sp-6 · 32px</div> <div class="bar" style="width:32px"></div></div>
  <div class="row-sp"><div class="cap">sp-7 · 48px</div> <div class="bar" style="width:48px"></div></div>
  <div class="row-sp"><div class="cap">sp-8 · 64px</div> <div class="bar" style="width:64px"></div></div>
  <div class="row-sp"><div class="cap">sp-9 · 96px</div> <div class="bar" style="width:96px"></div></div>
  <div class="row-sp"><div class="cap">sp-10 · 128px</div> <div class="bar" style="width:128px"></div></div>
</div></body></html>

interface:
  display_name: "GitHub Issue棚卸し PM"
  short_description: "一次調査workerを束ねてIssue棚卸しを進めるPMオーケストレーター"
  default_prompt: "このリポジトリのIssue棚卸しをPMとして1バッチ進める。1Issue=1Workerを基本に必要なら重複疑いクラスタを1Workerへ束ねる。workerのJSON出力を検証し、問題があれば1回だけ再試行する。最終的なIssue本文AI_STOCKTAKEブロック更新、分類ラベル排他更新、必要時アサイン更新はPMのみが実行する。"
policy:
  allow_implicit_invocation: true

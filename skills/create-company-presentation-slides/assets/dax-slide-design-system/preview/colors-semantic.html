<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>Semantic Colors</title>
<link rel="stylesheet" href="_card.css">
</head><body><div class="card">
  <div class="wrap">
    <div class="swatch" style="background:#5CCCA8;">
      <div class="name">success</div><div class="hex">#5CCCA8</div>
    </div>
    <div class="swatch light" style="background:#FFFF89;">
      <div class="name">highlight</div><div class="hex">#FFFF89</div>
    </div>
    <div class="swatch" style="background:#FF0000;">
      <div class="name">danger</div><div class="hex">#FF0000</div>
    </div>
    <div class="swatch" style="background:#FFB020;">
      <div class="name">warn</div><div class="hex">#FFB020</div>
    </div>
  </div>
  <div class="stack" style="gap:4px;">
    <div class="label">Pale tints (サブ背景)</div>
    <div class="wrap">
      <div class="swatch light" style="background:#EBF6FC;">
        <div class="name">tint 1</div><div class="hex">#EBF6FC</div>
      </div>
      <div class="swatch light" style="background:#DBEFF9;">
        <div class="name">tint 2</div><div class="hex">#DBEFF9</div>
      </div>
      <div class="swatch light" style="background:#E2EFF9;">
        <div class="name">tint 3</div><div class="hex">#E2EFF9</div>
      </div>
    </div>
  </div>
</div></body></html>

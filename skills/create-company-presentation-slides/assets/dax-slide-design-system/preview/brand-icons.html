<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>Icons</title>
<link rel="stylesheet" href="_card.css">
<style>
  .icon-slot { width: 120px; height: 120px; background:#FAFAFA; border:1px solid #EEE; border-radius: 8px; display:flex; align-items:center; justify-content:center; }
  .icon-slot img { max-width:64px; max-height:64px; }
  .unicode-icon { font-size: 40px; color: var(--fg-2); }
</style>
</head><body><div class="card">
  <div class="wrap" style="gap:12px;">
    <div class="stack" style="gap:4px; align-items:center;"><div class="icon-slot"><img src="../assets/icons/icon-question.png" alt="?"></div><div class="mono">question</div></div>
    <div class="stack" style="gap:4px; align-items:center;"><div class="icon-slot"><img src="../assets/icons/icon-lightbulb.png" alt="bulb"></div><div class="mono">lightbulb</div></div>
    <div class="stack" style="gap:4px; align-items:center;"><div class="icon-slot"><span class="unicode-icon">→</span></div><div class="mono">arrow</div></div>
    <div class="stack" style="gap:4px; align-items:center;"><div class="icon-slot"><span class="unicode-icon">✓</span></div><div class="mono">check</div></div>
    <div class="stack" style="gap:4px; align-items:center;"><div class="icon-slot"><span class="unicode-icon">●</span></div><div class="mono">bullet</div></div>
  </div>
  <div class="mono" style="color:var(--fg-3);">絵文字は不使用。アイコンは最小限、Unicode 矢印・チェックが基本。</div>
</div></body></html>

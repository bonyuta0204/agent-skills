<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>Before / After (状態ブロック)</title>
<link rel="stylesheet" href="_card.css">
<style>
  .cols { display:grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items:center; }
  .col { background:#fff; border:1px solid #CCCCCC; border-radius:8px; padding: 16px 20px; }
  .col h5 { font-family: var(--ff-body); font-size:11px; color: var(--fg-mute); font-weight:700; letter-spacing:0.1em; margin: 0 0 6px; }
  .col p  { font-family: var(--ff-display); font-size: 16px; font-weight:700; color: var(--fg-0); margin:0; line-height:1.3; }
  .arrow { font-size: 28px; color: var(--dax-blue); font-family: var(--ff-display); font-weight: 700; }
  .col.after { border-color: var(--dax-blue); background: #F5FBFE; }
</style>
</head><body><div class="card">
  <div class="cols">
    <div class="col">
      <h5>現状</h5>
      <p>負のスパイラルを<br>絵に描いたような状況</p>
    </div>
    <div class="arrow">→</div>
    <div class="col after">
      <h5>目指す姿</h5>
      <p>他社では真似ができない<br>最強の開発組織</p>
    </div>
  </div>
</div></body></html>

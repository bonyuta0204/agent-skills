<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>Type — Emphasis patterns</title>
<link rel="stylesheet" href="_card.css">
<style>
  .spec { font-family: var(--ff-display); margin:0; line-height:1.3; font-size:28px; font-weight:700; color: var(--fg-0); }
  .meta { font-family: var(--ff-mono); font-size: 11px; color: var(--fg-mute); }
  .blue { color: #00AFF4; }
  .coral { color: #FC7878; }
</style>
</head><body><div class="card">
  <div class="stack" style="gap:4px;">
    <div class="meta">"" 引用符で強調 (ブルー)</div>
    <div class="spec"><span class="blue">“最高”</span> のプロダクト</div>
  </div>
  <div class="stack" style="gap:4px;">
    <div class="meta">蛍光マーカー風 (イエロー背景)</div>
    <div class="spec">レビュアーが <span class="dax-marker">3秒で気づく</span> バグ</div>
  </div>
  <div class="stack" style="gap:4px;">
    <div class="meta">数値の強調 (大きく/色)</div>
    <div class="spec">月間 PR マージ数は年間で <span class="coral" style="font-size:48px; font-weight:900;">5倍</span> に</div>
  </div>
</div></body></html>

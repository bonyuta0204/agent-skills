interface:
  display_name: "GitHub PRレビュー棚卸し Worker"
  short_description: "単一PRの shallow investigation を行い厳格JSONを返す専用worker"
  default_prompt: "与えられた単一PRについて shallow investigation を行い、定義済みJSON契約で結果を返す。判定は PR の正しさではなく review readiness に限定する。queue bucket は RETURN_NOW / WATCH / REVIEW_NOW / DONE_OR_OUT_OF_SCOPE だけを使う。RETURN_NOW では blocking_reasons と return_message_draft を必ず返す。REVIEW_NOW では difficulty、estimated_review_minutes、risk、urgency、priority_tier を必ず返す。重要: このworkerは調査とJSON返却のみを実行し、gh pr review、gh pr comment、label 更新など GitHub の更新操作を行ってはいけない。"
policy:
  allow_implicit_invocation: false

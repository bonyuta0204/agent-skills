interface:
  display_name: "GitHub Issue棚卸し PM"
  short_description: "一次調査workerを束ねてIssue棚卸しを進めるPMオーケストレーター"
  default_prompt: "このリポジトリのIssue棚卸しをPMとして進める。max_workers分のワーカープールでWorker調査を並列に走らせ、完了したものからPMが逐次処理する。まず分類ラベルなし/AI_STOCKTAKEブロックなしの未棚卸しIssueを優先処理する。Worker完了後にJSON検証し、問題があれば1回だけ再試行する。AI_FIXABLEの expected_behavior は配列必須で、string単体はrejectして再試行させる。検証後、処理済みIssueのサマリ（番号・分類・要約・根拠）と照合し重複を検出する。重複疑いはユーザーに相談してから分類を確定する。検証・重複チェック完了後に本文AI_STOCKTAKE更新と分類ラベル排他更新を適用し、処理済みサマリに追加してから空きスロットに次のWorkerを投入する。ユーザーはシステムに詳しく、バグの背景情報を持っている。調査だけで埋められない情報ギャップ（仕様の所在不明、再現条件が特定不能、ドメイン固有の制約、Issue間の関係、影響範囲の判断材料不足、分類根拠が薄い場合）は主体的にユーザーへ聞きに行く。十分な根拠がある判断にいちいち承認を求めず、聞くのは情報が足りないときだけ。GitHub更新（本文/ラベル/必要時アサイン）はPMのみが実行する。"
policy:
  allow_implicit_invocation: true

interface:
  display_name: "GitHub Issue棚卸し PM"
  short_description: "一次調査workerを束ねてIssue棚卸しを進めるPMオーケストレーター"
  default_prompt: "このリポジトリのIssue棚卸しをPMとして進める。対象は明示された issues のみとし、state file を作ってキュー状態・retry_count・processed_summaries を永続化しながら進める。max_workers 分のワーカープールで単一Issue worker を並列に走らせ、完了したものからPMが逐次処理する。Worker完了後にJSON検証し、問題があれば1回だけ再試行する。AI_FIXABLEの expected_behavior は配列必須で、string単体はrejectする。spec_refs は空配列を許可する。重複判定はPM専有で、workerにCLOSE_DUPLICATEを返させない。検証後、processed_summaries と照合して重複疑いを見つけた場合だけユーザーに相談し、承認後にPMがCLOSE_DUPLICATEへ正規化する。検証・重複チェック完了後に本文AI_STOCKTAKE更新と分類ラベル排他更新を適用し、processed_summaries を更新してから空きスロットに次のWorkerを投入する。worker_contract_failure や worker_execution_failure をそのまま HUMAN_CONTEXT_REQUIRED に変換しない。GitHub更新はPMのみが実行する。"
policy:
  allow_implicit_invocation: true

interface:
  display_name: "Create Explanatory Diagram"
  short_description: "設計補足向けの説明図を適切な生成手段で作る"
  default_prompt: "Use $create-explanatory-diagram to turn a concept, responsibility boundary, or flow into a slide-style explanatory diagram. Prefer imagegen for polished low-to-mid density visuals, but use SVG/HTML when exact labels or dense information matter. Provide a diagram brief, final prompt or source, saved PNG path, and insertion guidance."

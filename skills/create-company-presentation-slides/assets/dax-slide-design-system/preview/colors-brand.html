<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>Brand Colors</title>
<link rel="stylesheet" href="_card.css">
</head><body><div class="card">
  <div class="stack">
    <div class="label">Primary</div>
    <div class="wrap">
      <div class="swatch" style="background:#00AFF4;">
        <div class="name">dax blue</div><div class="hex">#00AFF4</div>
      </div>
      <div class="swatch" style="background:#00B0F0;">
        <div class="name">dax blue strong</div><div class="hex">#00B0F0</div>
      </div>
      <div class="swatch" style="background:#5B94F5;">
        <div class="name">dax blue solid bg</div><div class="hex">#5B94F5</div>
      </div>
    </div>
  </div>
  <div class="stack">
    <div class="label">Accent — kpiee</div>
    <div class="wrap">
      <div class="swatch" style="background:#FC7878;">
        <div class="name">kpiee coral</div><div class="hex">#FC7878</div>
      </div>
      <div class="swatch light" style="background:#FFD5D1;">
        <div class="name">kpiee soft</div><div class="hex">#FFD5D1</div>
      </div>
    </div>
  </div>
</div></body></html>

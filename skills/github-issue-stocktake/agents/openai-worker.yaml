interface:
  display_name: "GitHub Issue棚卸し Worker"
  short_description: "Issue一次調査を行い、厳格JSONレポートを返す専用worker"
  default_prompt: "与えられたIssueについて一次調査を行い、定義済みJSON契約で結果を返す。分類はCLOSE_DONE/CLOSE_DUPLICATE/AI_FIXABLE/HUMAN_SPEC_REQUIRED/HUMAN_REPRO_REQUIRED/HUMAN_CONTEXT_REQUIREDのみ使う。AI_FIXABLEはconfidence 0.75以上のみ。重要: このworkerは調査とJSON返却のみを実行し、gh issue editやラベル更新などGitHubの更新操作を行ってはいけない。"
policy:
  allow_implicit_invocation: false

<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>Page footer</title>
<link rel="stylesheet" href="_card.css">
<style>
  .footer { display:flex; align-items:center; justify-content:space-between; padding: 14px 20px; border-top: 1px solid #EEE; background: #fff; }
  .footer .left { display:flex; align-items:center; gap: 12px; font-family: var(--ff-body); font-size: 12px; color: var(--fg-3); }
  .footer .left img { height: 16px; }
  .footer .right { font-family: var(--ff-mono); font-size: 12px; color: var(--fg-mute); }

  .tag-resub { display:inline-block; font-family: var(--ff-body); font-size: 11px; color: var(--fg-3); padding: 2px 8px; border:1px solid var(--rule); border-radius: 999px; background: #fff; }
</style>
</head><body><div class="card">
  <div class="footer">
    <div class="left">
      <img src="../assets/logos/bdash-logo.png" alt="">
      <span>17期3Q データ基盤キックオフ</span>
    </div>
    <div class="right">12 / 128</div>
  </div>
  <div class="wrap" style="gap:8px; align-items:center;">
    <span class="tag-resub">再掲</span>
    <span class="mono">左下に付ける過去スライドの再掲タグ</span>
  </div>
</div></body></html>

<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>Speaker card</title>
<link rel="stylesheet" href="_card.css">
<style>
  .speaker { display:flex; align-items:center; gap:20px; padding: 16px; background:#fff; border:1px solid #EEE; border-radius:8px; }
  .speaker .avatar { width:88px; height:88px; border-radius:50%; background: linear-gradient(135deg,#DBEFF9,#FFD5D1); display:flex; align-items:center; justify-content:center; font-family:var(--ff-display); font-weight:700; font-size:30px; color:#fff; letter-spacing: -0.02em; }
  .speaker .role { font-family: var(--ff-body); font-size:12px; color:var(--fg-3); letter-spacing:0.08em; }
  .speaker .name { font-family: var(--ff-display); font-size: 24px; font-weight:700; color:var(--fg-0); margin: 2px 0; }
  .speaker .team { font-family: var(--ff-body); font-size:13px; color: var(--fg-2); }
</style>
</head><body><div class="card">
  <div class="speaker">
    <div class="avatar">梶</div>
    <div>
      <div class="role">発表者</div>
      <div class="name">梶山 涼介</div>
      <div class="team">PdM チーム</div>
    </div>
  </div>
  <div class="speaker">
    <div class="avatar" style="background: linear-gradient(135deg,#FFD5D1,#00AFF4);">中</div>
    <div>
      <div class="role">発表者</div>
      <div class="name">中村 優太</div>
      <div class="team">kpiee 開発</div>
    </div>
  </div>
</div></body></html>
